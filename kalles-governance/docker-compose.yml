version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Event Bus (GCP Pub/Sub Emulator)
  # --------------------------------------------------------------------------
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: kalles-pubsub
    ports:
      - "8085:8085"
    environment:
      - PUBSUB_PROJECT_ID=kalles-buss-local
      - PUBSUB_EMULATOR_HOST=0.0.0.0:8085
    command: gcloud beta emulators pubsub start --project=kalles-buss-local --host-port=0.0.0.0:8085
    networks:
      - kalles-net

  # --------------------------------------------------------------------------
  # Databases (PostgreSQL for each Domain - Aligned with GCP)
  # --------------------------------------------------------------------------
  finance-db:
    image: postgres:15-alpine
    container_name: kalles-finance-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kalles_finance_user
      POSTGRES_PASSWORD: kalles_finance_password_local
      POSTGRES_DB: kalles-finance
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    networks:
      - kalles-net

  hr-db:
    image: postgres:15-alpine
    container_name: kalles-hr-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: kalles_hr_user
      POSTGRES_PASSWORD: kalles_hr_password_local
      POSTGRES_DB: kalles-hr
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    networks:
      - kalles-net

  traffic-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: kalles-traffic-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: kalles_traffic_user
      POSTGRES_PASSWORD: kalles_traffic_password_local
      POSTGRES_DB: kalles-traffic
    volumes:
      - traffic-db-data:/var/lib/postgresql/data
    networks:
      - kalles-net

  energy-db:
    image: postgres:15-alpine
    container_name: kalles-energy-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kalles_energy_user
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: kalles-energy-depot
    volumes:
      - energy-db-data:/var/lib/postgresql/data
    networks:
      - kalles-net

  simulation-db:
    image: postgres:15-alpine
    container_name: kalles-simulation-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: kalles-simulation
    volumes:
      - simulation-db-data:/var/lib/postgresql/data
    networks:
      - kalles-net

  process-db:
    image: postgres:15-alpine
    container_name: kalles-process-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: kalles_process_user
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: kalles-process
    volumes:
      - process-db-data:/var/lib/postgresql/data
    networks:
      - kalles-net

  # --------------------------------------------------------------------------
  # Microservices
  # --------------------------------------------------------------------------
  kalles-finance:
    build:
      context: ..
      dockerfile: packages/kalles-finance/Dockerfile
    container_name: kalles-finance-app
    depends_on:
      - pubsub-emulator
      - finance-db
    environment:
      - PUBSUB_PROJECT_ID=kalles-buss-local
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - DB_HOST=finance-db
      - DB_PORT=5432
      - DB_USER=kalles_finance_user
      - DB_PASSWORD=kalles_finance_password_local
      - DB_NAME=kalles-finance
    networks:
      - kalles-net

  kalles-hr:
    build:
      context: ..
      dockerfile: packages/kalles-hr/Dockerfile
    container_name: kalles-hr-app
    depends_on:
      - pubsub-emulator
      - hr-db
    environment:
      - PUBSUB_PROJECT_ID=kalles-buss-local
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - DB_HOST=hr-db
      - DB_PORT=5432
      - DB_USER=kalles_hr_user
      - DB_PASSWORD=kalles_hr_password_local
      - DB_NAME=kalles-hr
    networks:
      - kalles-net

  kalles-traffic:
    build:
      context: ..
      dockerfile: packages/kalles-traffic/Dockerfile
    container_name: kalles-traffic-app
    depends_on:
      - pubsub-emulator
      - traffic-db
    environment:
      - PUBSUB_PROJECT_ID=kalles-buss-local
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - DB_HOST=traffic-db
      - DB_PORT=5432
      - DB_USER=kalles_traffic_user
      - DB_PASSWORD=kalles_traffic_password_local
      - DB_NAME=kalles-traffic
    networks:
      - kalles-net

  kalles-energy-depot:
    build:
      context: ../
      dockerfile: packages/kalles-energy-depot/Dockerfile
    container_name: kalles-energy-app
    ports:
      - "8080:8080"
    depends_on:
      - pubsub-emulator
      - energy-db
    environment:
      - PUBSUB_PROJECT_ID=kalles-buss-local
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - DB_HOST=energy-db
      - DB_PORT=5432
      - DB_USER=kalles_energy_user
      - DB_PASSWORD=local_password
      - DB_NAME=kalles-energy-depot
    networks:
      - kalles-net

  kalles-adapters:
    build:
      context: ..
      dockerfile: packages/adapters/Dockerfile
    container_name: kalles-adapters-app
    depends_on:
      - pubsub-emulator
    environment:
      - PUBSUB_PROJECT_ID=kalles-buss-local
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
    networks:
      - kalles-net

networks:
  kalles-net:
    driver: bridge

volumes:
  finance-db-data:
  hr-db-data:
  traffic-db-data:
  energy-db-data:
  simulation-db-data:
  process-db-data:
