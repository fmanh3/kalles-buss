steps:
# 0. Installera och Bygg hela monorepot
- name: 'node:22'
  entrypoint: 'sh'
  args: 
    - '-c'
    - 'npm ci && npm run build'

# 1. Bygg Finance Image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'europe-west1-docker.pkg.dev/joakim-hansson-lab/cloud-run-source-deploy/kalles-finance:$_IMAGE_TAG',
    '-f', 'packages/kalles-finance/Dockerfile',
    '.'
  ]

# 2. Push Finance Image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-west1-docker.pkg.dev/joakim-hansson-lab/cloud-run-source-deploy/kalles-finance:$_IMAGE_TAG']

